# Immich beside the app (plan: milestone 7), Immich's own compose trimmed to what we use. The
# phones' Immich app backs the camera rolls up into it; the dashboard reads albums, "on this day"
# and thumbnails through its API with a key made under Account settings → API keys.
#   mkdir -p ~/immich && cp ops/immich/compose.yml ops/immich/env.example ~/immich/ && cd ~/immich
#   mv env.example .env && edit .env (UPLOAD_LOCATION, DB_PASSWORD) && docker compose up -d
# Then http://<this machine>:2283 for the first admin account.
name: immich
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich_server
    restart: always
    env_file: .env
    ports:
      - "2283:2283"
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - redis
      - database
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: immich_machine_learning
    restart: always
    env_file: .env
    volumes:
      - model-cache:/cache
  redis:
    image: docker.io/valkey/valkey:8-bookworm
    container_name: immich_redis
    restart: always
  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich_postgres
    restart: always
    env_file: .env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
volumes:
  model-cache:
